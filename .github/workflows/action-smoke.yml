name: Action smoke

on:
  pull_request:

permissions: {}

concurrency:
  group: action-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dry-run the action on the demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run the action in dry-run
        id: smoke
        uses: ./action
        continue-on-error: true
        with:
          working-directory: examples/demo
          version: file:packages/agentlint
          base: ${{ github.base_ref }}
          dry-run: "true"

      - name: Assert the dry-run outcome
        env:
          GATE: ${{ steps.smoke.outputs.gate }}
          HUMAN: ${{ steps.smoke.outputs.human }}
          ARTIFACT: ${{ steps.smoke.outputs.artifact }}
          PLAN: ${{ steps.smoke.outputs.dry-run-plan }}
        run: |
          echo "gate=$GATE human=$HUMAN artifact=$ARTIFACT"
          test "$GATE" = "closed"
          test "$HUMAN" -ge 1
          test -n "$ARTIFACT"
          test -s "$ARTIFACT"
          printf '%s' "$PLAN" | grep -q '/check-runs'
