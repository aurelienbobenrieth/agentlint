name: Action smoke

on:
  pull_request:

permissions: {}

concurrency:
  group: action-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dry-run the action on the demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run the action in dry-run
        id: smoke
        uses: ./action
        continue-on-error: true
        with:
          working-directory: examples/demo
          version: file:packages/agentlint
          base: ${{ github.base_ref }}
          dry-run: "true"

      - name: Assert the dry-run outcome
        env:
          GATE: ${{ steps.smoke.outputs.gate }}
          HUMAN: ${{ steps.smoke.outputs.human }}
          ARTIFACT: ${{ steps.smoke.outputs.artifact }}
          PLAN: ${{ steps.smoke.outputs.dry-run-plan }}
        run: |
          echo "gate=$GATE human=$HUMAN artifact=$ARTIFACT"
          test "$GATE" = "closed"
          test "$HUMAN" -ge 1
          test -n "$ARTIFACT"
          test -s "$ARTIFACT"
          printf '%s' "$PLAN" | grep -q '/check-runs'
