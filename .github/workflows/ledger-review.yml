name: Ledger review

# Posts new agentlint dispositions and pending human approvals as a sticky PR
# comment - reviewers read reasons, not raw .jsonl diffs.

on:
  pull_request:

concurrency:
  group: ledger-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  ledger-review:
    name: Comment ledger delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agentlint
        run: pnpm --filter @aurelienbbn/agentlint exec tsdown

      - name: Run ledger review
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node packages/agentlint/dist/bin.mjs ledger review \
            --base "origin/${{ github.base_ref }}" --format jsonl > ledger-review.jsonl
          node packages/agentlint/scripts/render-ledger-review.mjs \
            ledger-review.jsonl "${{ github.base_ref }}" > ledger-review.md
          cat ledger-review.md
          cat ledger-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("ledger-review.md", "utf8");
            const marker = "<!-- agentlint-ledger-review -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
