name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.19.0 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and pack
        id: package
        uses: ./.github/actions/validate # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @agentlint/review exec playwright install --with-deps chromium

      - name: Test review UI in Chromium
        run: pnpm test:browser

  gate:
    name: Validate
    if: always()
    needs:
      - validate
      - workflows
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          MATRIX_RESULT: ${{ needs.validate.result }}
          WORKFLOW_RESULT: ${{ needs.workflows.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$MATRIX_RESULT" = success && test "$WORKFLOW_RESULT" = success && test "$BROWSER_RESULT" = success
