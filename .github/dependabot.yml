version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Node 22 is the minimum runtime; newer types would admit APIs it lacks
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The packaged tree-sitter-wasms grammars target the 0.25 ABI
      - dependency-name: web-tree-sitter
        versions: [">=0.26.0"]
    groups:
      # foldkit peers on one exact Effect release, so they move together
      effect-runtime:
        patterns:
          - effect
          - "@effect/*"
          - foldkit
          - "@foldkit/*"
      validation-tooling:
        dependency-type: development
        patterns:
          - typescript
          - vitest
          - "@vitest/*"
          - "@playwright/*"
          - oxlint
          - oxfmt
          - knip
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
